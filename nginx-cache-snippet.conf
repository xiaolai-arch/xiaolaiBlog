# Nginx 性能片段（宝塔站点配置 140.143.170.29.conf 的 server 块内追加）
# 文件名带内容 hash，可永久缓存；index.html 不缓存，保证发版后立刻拿到新引用。
# 改完后：nginx -t && nginx -s reload

location /assets/ {
    root /www/wwwroot/fronted/dist;
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

location = /index.html {
    root /www/wwwroot/fronted/dist;
    add_header Cache-Control "no-cache";
}

# 评论接口限流（后端已有按 IP 限流，这是第二层）。需在 http 块加：
#   limit_req_zone $binary_remote_addr zone=comments:1m rate=1r/s;
location ~ ^/api/v1/articles/.+/comments$ {
    limit_req zone=comments burst=5 nodelay;
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
