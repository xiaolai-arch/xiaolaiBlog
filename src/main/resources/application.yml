server:
  port: 8081

spring:
  application:
    name: xiaolai-blog
  profiles:
    active: dev
  datasource:

    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/xiaolai_blog?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root # 输入您自己的数据库root用户密码
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 35MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.xiaolai.blog.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT config
jwt:
  # 生产环境务必通过环境变量 JWT_SECRET 覆盖（blog.env），否则启动时会打印醒目警告
  secret: ${JWT_SECRET:xiaolai-blog-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256}
  expiration: 86400000

# CORS 白名单（逗号分隔），生产/本地各自覆盖
app:
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://www.xiaolai.cyou,https://xiaolai.cyou}

# File upload
upload:
  path: ./uploads
  allowed-extensions: jpg,jpeg,png,gif,webp,bmp,svg,zip,rar,pdf,doc,docx

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
